<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LZ Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --font-serif: "Fraunces", "Source Serif 4", Georgia, serif;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;

    /* accent (tweakable) */
    --accent-h: 250;
    --accent: oklch(0.68 0.18 var(--accent-h));
    --accent-soft: oklch(0.68 0.18 var(--accent-h) / 0.14);
    --accent-fg: oklch(0.78 0.14 var(--accent-h));

    /* sidebar */
    --sidebar-w: 224px;

    /* card density */
    --density: 1;
  }

  /* DARK (default) — osvetljeno */
  html[data-theme="dark"] {
    --bg: oklch(0.235 0.008 260);
    --bg-raised: oklch(0.275 0.008 260);
    --bg-sunken: oklch(0.21 0.008 260);
    --bg-ai: oklch(0.285 0.012 250);
    --fg: oklch(0.965 0.008 90);
    --fg-muted: oklch(0.76 0.01 90);
    --fg-subtle: oklch(0.6 0.01 90);
    --border: oklch(1 0 0 / 0.09);
    --border-strong: oklch(1 0 0 / 0.16);
    --hover-bg: oklch(1 0 0 / 0.035);
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg: oklch(0.985 0.004 85);
    --bg-raised: oklch(1 0 0);
    --bg-sunken: oklch(0.96 0.005 85);
    --bg-ai: oklch(0.97 0.008 250);
    --fg: oklch(0.22 0.012 260);
    --fg-muted: oklch(0.46 0.01 260);
    --fg-subtle: oklch(0.62 0.008 260);
    --border: oklch(0 0 0 / 0.09);
    --border-strong: oklch(0 0 0 / 0.16);
    --hover-bg: oklch(0 0 0 / 0.025);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11";
  }

  /* MOBILE */
  @media (max-width: 820px) {
    :root { --sidebar-w: 0px; }
    .pad-page { padding-left: 18px !important; padding-right: 18px !important; }
    .hide-on-mobile { display: none !important; }
    .topbar { padding-left: 18px !important; padding-right: 18px !important; }
    .hero-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .hero-title { font-size: 32px !important; }
    .two-col { grid-template-columns: 1fr !important; }
    .progress-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .progress-widget-wide { grid-column: span 2 !important; }
    .summary-paragraphs { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 560px) {
    .progress-grid { grid-template-columns: 1fr !important; }
    .progress-widget-wide { grid-column: span 1 !important; }
  }

  /* typography primitives */
  .serif { font-family: var(--font-serif); font-optical-sizing: auto; letter-spacing: -0.01em; }
  .mono  { font-family: var(--font-mono); }
  .micro { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* focus */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* fade-in when switching screens */
  @keyframes screenIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .screen-in { animation: screenIn 280ms cubic-bezier(.22,.61,.36,1) both; }

  /* shared card lift */
  .lift { transition: transform 180ms cubic-bezier(.22,.61,.36,1), border-color 180ms ease, background 180ms ease; }
  .lift:hover { transform: translateY(-2px); }

  /* kbd */
  .kbd {
    font-family: var(--font-mono); font-size: 10.5px;
    padding: 2px 6px; border: 1px solid var(--border);
    border-radius: 5px; color: var(--fg-muted); background: var(--bg-raised);
  }

  /* pill */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; font-size: 11px; font-weight: 500;
    border-radius: 999px; letter-spacing: 0.01em;
    border: 1px solid var(--pill-border, var(--border));
    color: var(--pill-fg, var(--fg-muted));
    background: var(--pill-bg, transparent);
  }

  /* stripe placeholder */
  .stripe {
    background-image: repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 10px);
  }

  /* AI section subtle grain */
  .grain::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(oklch(1 0 0 / 0.015) 1px, transparent 1px);
    background-size: 4px 4px; mix-blend-mode: overlay; border-radius: inherit;
  }

  /* hide default button styles */
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }

  input, textarea { font-family: inherit; color: inherit; }
  input::placeholder, textarea::placeholder { color: var(--fg-subtle); }
</style>
