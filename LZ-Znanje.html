"Atomske navike"}},{id:"l2",tag:"fokus",title:"Plitak rad popunjava prostor koji kognitivni rad ostavi.",body:"Ako ne zakažeš svesno duboki rad, imejlovi i sastanci apsorbovaće svaki namenjeni blok. Zaštiti jutro.",source:{kind:"book",id:"deep-work",label:"Dubok rad"}},{id:"l3",tag:"psihologija",title:"Zabluda planiranja je osobina, ne bag.",body:"Ljudi dosledno potcenjuju vreme jer modeliramo plan, ne trenja. Dodaj 40% na procene kao osnovu.",source:{kind:"book",id:"thinking-fast-slow",label:"Misliti brzo i sporo"}},{id:"l4",tag:"novac",title:"Postati bogat i ostati bogat su različite veštine.",body:"Ukamaćivanje nagrađuje strpljenje više nego genijalnost. Preživljavanje je preduslov za sve ostalo.",source:{kind:"book",id:"psychology-money",label:"Psihologija novca"}},{id:"l5",tag:"prodaja",title:"Ogledanje je besplatno poverenje.",body:"Ponovi poslednje 1-3 reči onoga što sagovornik kaže. Ne košta ništa, signalizira pažnju i otvara ga da razradi.",source:{kind:"book",id:"never-split",label:"Nikad ne deli razliku"}},{id:"l6",tag:"sistemi",title:"Isporučuj cikluse, ne rokove.",body:"Fiksan vremenski budžet + promenljiv obim tera tim da bira šta je bitno. Rokovi pozivaju scope creep; ciklusi ga odbacuju.",source:{kind:"book",id:"shape-up",label:"Shape Up"}},{id:"l7",tag:"strategija",title:"Monopol je nagrada za prvo rešavanje teškog problema.",body:"Konkurencija smanjuje marže. Cilj nije osvojiti tržište - već izgraditi tržište na kojem samo ti možeš da služiš.",source:{kind:"book",id:"zero-to-one",label:"Od nule do jedan"}},{id:"l8",tag:"liderstvo",title:"Menadžerska poluga = učinak / uloženo vreme.",body:"Sastanci, 1:1, revizije - svaki treba meriti po odlukama koje je oblikovao, ne po vremenu koje je potrošio.",source:{kind:"book",id:"high-output",label:"Menadžment visokog učinka"}},{id:"l9",tag:"identitet",title:"Glasaj za osobu koja želiš da postaneš.",body:"Svaki postupak je glasački listić. Nije ti potrebna većina - samo pluralnost malih dnevnih glasova u istom smeru.",source:{kind:"book",id:"atomic-habits",label:"Atomske navike"}},{id:"l10",tag:"pisanje",title:"Pisanje je mišljenje koje je postalo vidljivo.",body:"Ako ne možeš jasno da napišeš, ne razumeš. Koristi stranicu da preispitaš sopstvenu ideju pre nego što je brаниš.",source:{kind:"notebook",label:"Sveska · Pisanje"}},{id:"l11",tag:"odluke",title:"Jednosmerna vs dvosmerna vrata.",body:"Reverzibilne odluke zaslužuju brzinu; ireverzibilne zaslužuju pažnju. Većina timova obrne ovo i sve uspori.",source:{kind:"book",id:"working-backwards",label:"Unazad"}},{id:"l12",tag:"proizvod",title:"Počni od saopštenja za javnost.",body:"Ako ne možeš da napišeš uverljivo najavno saopštenje, proizvod nije spreman za razvoj. Radi unazad od korisnika.",source:{kind:"book",id:"working-backwards",label:"Unazad"}},{id:"l13",tag:"fokus",title:"Ostatak pažnje je porez na kontekst.",body:"Svako prebacivanje izmedju zadataka ostavlja fragment prethodnog. Dva sata fragmentisanog rada nije jednako dva sata dubokog rada.",source:{kind:"book",id:"deep-work",label:"Dubok rad"}},{id:"l14",tag:"navike",title:"Jasno, privlačno, lako, zadovoljavajuće.",body:'Četiri zakona, po redu. Većina neuspelih navika pukne na "lako" - trenje je nevidljivo dok ga ne izmeriš u sekundama.',source:{kind:"book",id:"atomic-habits",label:"Atomske navike"}},{id:"l15",tag:"strategija",title:"Strast sledi majstorstvo, ne obrnuto.",body:'Zadovoljstvo u karijeri korelira sa retkim i vrednim veštinama, ne sa "pronalaženjem strasti". Izgradi veštinu, pa onda dolazi ljubav.',source:{kind:"book",id:"so-good",label:"Toliko dobar..."}},{id:"l16",tag:"psihologija",title:"Prepreka je put.",body:"Svaka prepreka sadrži oblik puta kroz nju. Stoički potez je da se otpor metaboliše u gorivo.",source:{kind:"book",id:"obstacle-way",label:"Prepreka je put"}},{id:"l17",tag:"sistemi",title:"Cilj je smer, ne destinacija.",body:"Sistemi kontinuirano proizvode rezultate; ciljevi daju jedan binarni rezultat na kraju. Dizajniraj sistem, ne finiš.",source:{kind:"notebook",label:"Sveska · Sistemi"}},{id:"l18",tag:"prodaja",title:'"Ne" je početak pregovora.',body:'Brzo "ne" je jeftina informacija. Gradi procese koji brzo zarade "ne" da bi vreme trošio na pravo "da".',source:{kind:"book",id:"never-split",label:"Nikad ne deli razliku"}}],os=[{id:"i1",title:"Mikro-kurs o pregovaranju za developere",tag:"proizvod",cover:["#2B4C7E","#FFD23F"],date:"12. apr 2026",body:"3x15 min video lekcija - jedna knjiga po lekciji. Prva: Voss. Druga: Mnookin. Treća: moja sinteza. Naplatiti 29 EUR. Testirati na LinkedIn publici."},{id:"i2",title:'Newsletter: "Jedna lekcija nedeljno"',tag:"pisanje",cover:["#5A3E2B","#E8D5B7"],date:"08. apr 2026",body:"Ponedeljkom u 7h - jedna lekcija iz nedeljnog čitanja, u maks 300 reči. Cilj: 1000 čitalaca za 90 dana. Distribucija preko Substack + LinkedIn post."},{id:"i3",title:'Aplikacija za "knjiga dana"',tag:"navike",cover:["#E63946","#1A1A1A"],date:"02. apr 2026",body:"Svaki dan po jedna citat-kartica iz moje lične baze. Push u 8h. Lokalno na telefonu, bez backend-a. Tri stila prikaza: editorial, mono, kolaž."},{id:"i4",title:"Video esej: zašto su ciljevi precenjeni",tag:"sistemi",cover:["#1B998B","#F5F0E3"],date:"28. mar 2026",body:"15 min esej - spoj Clear + Atomic Habits + lični primer iz Q1. Scenario, glas, a-roll sa belom tablom. Objaviti na YouTube + cross-post na X."},{id:"i5",title:"Radionica: dizajn okruženja",tag:"navike",cover:["#E8C547","#1C1C1C"],date:"20. mar 2026",body:"Dvočasovna radionica - učesnici mapiraju svoj radni prostor, identifikuju 3 trenja i 3 znaka. Plaća se 49 EUR, grupa do 10. Prvi pilot sa kolegama iz konsaltinga."},{id:"i6",title:"Klub čitanja samo za ljude koji prave",tag:"biznis",cover:["#274060","#FFC857"],date:"14. mar 2026",body:"Mesečni sastanak uživo. Svaki član mora doneti jednu ideju primene iz knjige. Ne priča se o sadržaju - priča se o transferu. Grad: Beograd, 8 ljudi."},{id:"i7",title:'Ritual "nedelja bez sastanaka"',tag:"fokus",cover:["#2A7F62","#F4EFE6"],date:"05. mar 2026",body:"Prvu nedelju u mesecu - nijedan sastanak, samo dubok rad. Test u timu. Meriti broj isporučenih artefakata vs uobičajena nedelja. Očekujem 2x izlaz."},{id:"i8",title:"Kolaboracija sa @marijom oko stoicizma",tag:"psihologija",cover:["#5A3E2B","#F4F1DE"],date:"28. feb 2026",body:"Zajednička mini-serija (3 epizode) o stoicizmu u savremenom biznisu. Holiday + Aurelije. Ona govori, ja pišem scenario. Potvrditi do kraja marta."}],ol=[{id:"v1",title:"Kako dizajniram svoje jutro",duration:"12:42",date:"18. apr 2026",tag:"navike",cover:["#E8C547","#1C1C1C"],views:142,description:"Prolazim kroz svoj jutarnji ritual korak po korak - od 5:30 do 8:00. Šta radi, šta je otpalo, šta testiram ovaj kvartal. Spominjem Atomske navike i Duboki rad kao glavne izvore."},{id:"v2",title:"Moj sistem za vodjenje beleški",duration:"18:05",date:"10. apr 2026",tag:"sistemi",cover:["#2B4C7E","#F4EFE6"],views:238,description:"Showcase celog toka - od markera u knjizi, do digitalne kartice u LZ, do kvartalnog pregleda. Tri pravila koja sam iskristalisao za tri godine."},{id:"v3",title:"Pregovaranje sa klijentom: pravi primer",duration:"24:18",date:"02. apr 2026",tag:"prodaja",cover:["#1A1A1A","#E63946"],views:89,description:"Glumljena, ali bazirana na pravom razgovoru iz februara. Primenjujem Vossove tehnike - ogledanje, taktička empatija, kalibrisana pitanja."},{id:"v4",title:"Čitao sam 50 knjiga. Ovo je ostalo.",duration:"15:33",date:"22. mar 2026",tag:"biznis",cover:["#FF5A1F","#FFFFFF"],views:412,description:"Destilacija tri godine čitanja u pet principa koje i dalje koristim svake nedelje. Ne lista, ne rang - samo pet stvari koje su preživele."},{id:"v5",title:"Kako se nosim sa prokrastinacijom",duration:"09:21",date:"14. mar 2026",tag:"psihologija",cover:["#C1666B","#F4EFE6"],views:167,description:"Iskren video. Ne kao guru. Ono što radi za mene - i ono što ne. Dva konkretna alata i jedna promena u okruženju."},{id:"v6",title:"Tiha nedelja: bez ekrana nedelju dana",duration:"21:47",date:"05. mar 2026",tag:"fokus",cover:["#F5F0E3","#1C1C1C"],views:198,description:"Eksperiment - nedelju dana bez telefona i društvenih mreža. Šta se desilo s pažnjom, snom, raspoloženjem. Iskreni zaključak sa brojevima."}],jp={"atomic-habits":{description:"Pročitana u dve nedelje tokom Q1 pregleda. Vraćao sam se na prvo i šesto poglavlje - najbolji priručnik za promenu ponašanja koji sam pročitao.",dateRead:"feb - mar 2024",lessons:[{id:"bl1",tag:"navike",title:"Identitet prethodi ponašanju.",body:"Ne odlukuješ da trčiš; odlučuješ da budeš trkač. Pomak identiteta se ukamaćuje. Svako ponavljanje je glas za osobu koja postaješ - i glačaka kutija se ne zatvara."},{id:"bl2",tag:"sistemi",title:"Trenje je tvoja jedinica mere.",body:"Navike ne padaju na motivaciji; padaju na trenju. Smanjiti cenu ponašanja za 20 sekundi vredi više od bilo kakvog treninga volje."},{id:"bl3",tag:"identitet",title:"Plato latentnog potencijala.",body:"Linearan ulaz, nelinearan izlaz. Razmak izmedju očekivanja i napretka je gde većina odustaje. Rezultati stizu kasno; rad to ne sme."}],notes:`Svakog januara ponovo čitam poglavlje o petlji navika. Spoj sa kvartalnim pregledom - mapirati svaku naviku na identitet koji pojačava. Najveći propušt prošle godine: znakovi u radnom kabinetu nisu bili dovoljno vidljivi. Štampao sam ček-listu na zidu za Q2.

Diskusija kluba 18. mart: grupa se podelila oko toga da li je okvir baziran na identitetu precenjen. Ne slažem se - bihejvioralno uvezbavanje JESTE identitet.`,summary:{paragraphs:["Džjms Klir tvrdi da smislena promena ne dolazi iz postavljanja ambicioznih ciljeva već iz dizajna malih, doslednih sistema. Knjiga preformuliše navike kao složenu kamatu samousavršavanja - svaka sitna akcija je sama po sebi nebitna, ali kumulativni povrat je definišuća varijabla života.","Centralni okvir je Četiri zakona promene ponašanja - učini ih očiglednim, privlačnim, lakim i zadovoljavajućim - primenjeni obrnuto za prekid loših navika. Ispod taktika teče dublja tvrdnja: da trajna promena proižilazi iz identiteta, ne iz ishoda."],ideas:[{title:"Ciljevi daju smer; sistemi daju napredak.",body:"Pobednici i gubitnici dele isti cilj. Razliku pravi sistem koji izgrade oko njega."},{title:"Pravilo 1%.",body:"Marginalna dnevna poboljšanja su nevidljiva iz dana u dan, ali transformativna tokom godine. Matematika ukamaćivanja je ravnodušna na veličinu."},{title:"Dizajn okruženja pobedjuje samodisciplinu.",body:"Većina takozvanih disciplinovanih ljudi je jednostavno učinila loše navike nepraktičnim, a dobre očiglednim. Znakovi rade posao koji volja ne može."},{title:"Slaganje navika.",body:'Zakači novu naviku za postojeću. "Nakon što sipam jutarnju kafu, pišem dvadeset minuta" pobedjuje svaki kalendarski podsetnik.'},{title:"Identitet iznad ishoda.",body:"Najdublja vrsta unutrašnje motivacije je kada navika postane deo identiteta. Cilj nije pročitati knjigu; cilj je postati čitalac."}],themes:["Promena ponašanja","Ukamaćivanje","Sistemsko razmišljanje","Samopoimanje"]}},"deep-work":{description:"Drugo čitanje. Principi su izdržali bolje od većine literature o produktivnosti - i dalje najoštriji argument za kognitivnu dubinu u ekonomiji pažnje.",dateRead:"sep 2023",lessons:[{id:"dw1",tag:"fokus",title:"Dubok rad je novi luksuz.",body:"U ekonomiji pažnje koja monetizuje distrakciju, održana koncentracija postaje i retka i nesrazmerno vredna. Retkost definiše cenu."},{id:"dw2",tag:"fokus",title:"Prigrli dosadu.",body:"Sposobnost koncentracije je veština koju atrofiraju konstantne novosti. Vraćanje iziskuje podnošenje dosadnih trenutaka bez posezanja za telefonom."},{id:"dw3",tag:"sistemi",title:"Ritualizuj ulazak.",body:"Fiksno mesto, fiksno vreme, fiksan otvarajući gest. Rituali smanjuju kognitivnu cenu počinjanja - skupi deo dubokog rada."}],notes:`Spojiti sa poglavljem o trenju iz Atomskih navika. Preklapanje: oba autora tretiraju volju kao najnepouzdaniji ulaz.

Lično pravilo: bez sastanaka pre 11h utorkom i četvrtkom. Prekršio 4 puta prošlog meseca. Treba postaviti kalendar da to podrazumevano sprovodi.`,summary:{paragraphs:["Kal Njuport iznosi dvostruki argument: da sposobnost fokusa bez distrakcije na kognitivno zahtevnim zadacima postaje retka u ekonomiji, i istovremeno sve vrednija. Rastući jaz izmedju ove dve krive, tvrdi on, je najvažnija karijerna prilika našeg vremena.","Druga polovina je preskriptivna - skup rituala, pravila i taktika zakazivanja za zaštitu dubokog rada u radnom okruženju optimizovanom za plitku distrakciju. Njuport je skeptičan i prema društvenim mrežama i prema kulturi sastanaka-kao-produktivnosti."],ideas:[{title:"Plitak rad je default.",body:"Ako aktivno ne ugradiš duboki rad u raspored, reaktivni rad popunjava prostor. To je entropija, ne lenjost."},{title:"Ostatak pažnje.",body:"Prebacivanje zadataka ostavlja kognitivni ostatak prethodnog. Cena je nevidljiva ali merljiva u kvalitetu izlaza."},{title:"Zakaži svaki minut.",body:"Blokiranje vremena te tera da se suočiš s tim kako zaista trošiš sate naspram kako zamisšljaš da ih trošiš. Razlika je obično brutalna."},{title:"Fiksno zakazana produktivnost.",body:"Tvrd kraj u 17:30 nije ograničenje - to je funkcija koja te tera da biraš. Hitnost izоštrava prioritete bolje od bilo kog okvira."},{title:"Napusti društvene mreže, uslovno.",body:"Trideset dana pauze, pa se pitaj da li je povratak vredeo cene pažnje. Većina alata ne prolazi test."}],themes:["Pažnja","Produktivnost","Rad sa znanjem","Karijerni kapital"]}}},as=[{id:"n1",title:"O prebacivanju konteksta",tag:"fokus",date:"19. apr 2026",body:"Ako posle svakog sastanka treba 23 minuta da se vratim u dubok rad - onda pet sastanaka dnevno jede skoro dva sata pre nego što išta uradim. Eksperiment: grupisati sve sastanke u jedan blok od 13h do 16h."},{id:"n2",title:"Zašto svaka knjiga ne zaslužuje belešku",tag:"pisanje",date:"12. apr 2026",body:"Primetio sam - knjige iz kojih pišem najmanje, koristim najviše. Ne zato što su bolje. Zato što ideje prolaze kroz telo umesto kroz papir. Ne treba sve da se arhivira."},{id:"n3",title:"Definicija uspeha koja se menja",tag:"zivot",date:"05. apr 2026",body:"Pre godinu dana: prihod. Sada: broj dubokih razgovora nedeljno. Za godinu dana: ko zna. Jedino što se ne menja je kvalitet pažnje."},{id:"n4",title:'Sistem za "probudi se sa strahom"',tag:"psihologija",date:"28. mar 2026",body:"Ako se probudim sa osećajem da nešto nije uredu, prvo pitanje: da li je to telo (hrana/san/kafa) ili um (stvarno pitanje)? 80% vremena - telo."},{id:"n5",title:"Spisak pitanja za sebe kvartalno",tag:"odluke",date:"22. mar 2026",body:"1) Šta sam prestao da radim što mi je oduzimalo energiju? 2) Ko mi je pomogao i da li sam rekao hvala? 3) Koja laž koju sam verovao se raspala? 4) Šta ću oprostiti sebi?"},{id:"n6",title:"Pravilo tri kafe",tag:"sistemi",date:"15. mar 2026",body:"Prvo: posao. Druga: kreativni rad. Treća: razgovor ili pauza. Ako pijem četvrtu - nešto ne radi. Radilo mesec dana, vratiću sada."},{id:"n7",title:"O ljudima koji se hvale kalendarom",tag:"liderstvo",date:"08. mar 2026",body:"Napunjen kalendar nije znak važnosti - to je znak da si dozvolio drugima da ti odrede prioritete. Prazni blokovi su aristokratski."},{id:"n8",title:"Kad prestanem da čitam knjigu",tag:"odluke",date:"01. mar 2026",body:"Pravilo od 50 strana izgleda dobro - ali mislim da stvarni signal nije broj strana. Ako posle 50 strana ne mislim o knjizi izmedju sesija, odlažem."}];function kp(){const t=[];for(let n=0;n<182;n++){const r=(n+3)%7,i=r===0||r===6,l=Math.sin(n*1.7)*.5+.5;let a=0;l>.35&&(a=1),l>.55&&(a=2),l>.72&&(a=3),l>.88&&(a=4),i&&(a=Math.min(4,a+(Math.random()>.5?1:0))),n<14&&(a=0),Math.random()<.08&&(a=0),t.push(a)}for(let n=171;n<181;n++)t[n]===0&&(t[n]=2);return t}const Sp=kp(),Wt=24,At=18,wp=42,zp=11,Cp="11 dana zaredom",Ep=["obstacle-way","range","creative-act","build"],b={appName:"Znanje",appSubtitle:"Lično · v2.4",nav:{home:"Početna",library:
